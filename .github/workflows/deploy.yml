name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 锁定与 packageManager 字段一致，避免 frozen-lockfile 被新 pnpm 的版本差异打挂
          version: '10.4.1'
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build site
        run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ASTRO_BASE: ${{ vars.ASTRO_BASE }}

      # 类型检查（先只报告不阻断）：当前有 187 个既有类型错误
      # （其中 index.astro 的 152 个是模板里用了 React 风格 JSX 导致语言服务解析失败）。
      # 全部修掉后把下面这行删掉，即可让类型错误阻断部署。
      - name: Type check
        run: pnpm check
        continue-on-error: true

      - name: Create .nojekyll file
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
