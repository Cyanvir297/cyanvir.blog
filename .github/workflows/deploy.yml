name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 锁定与 packageManager 字段一致，避免 frozen-lockfile 被新 pnpm 的版本差异打挂
          version: '10.4.1'
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ASTRO_BASE: ${{ vars.ASTRO_BASE }}

      # 类型检查门禁。
      #
      # 历史上这里挂着一个基线豁免：index.astro 模板里的 HTML 注释 <!-- --> 被
      # @astrojs/check 的语言服务当成 TSX 解析，报 8 个 ts(1003)/ts(1382)；frontmatter 里
      # 「正则字面量 + 模板字符串」共存又让它在收尾的 --- 上报 1 个 ts(1109)。9 个全是假阳性
      # —— 真错为 0，构建也不受影响（esbuild 走正常管线，dist/ 正常产出）。
      #
      # 现已根治：HTML 注释改用 Astro 的 {/* */}（a4fafa5），那个正则改用 startsWith。
      # pnpm check 现为 0 错误、退出码 0，基线豁免随之删除。
      #
      # 旧做法的坑，留作备忘：按路径排除（grep -v 'src/pages/index.astro'）会把该文件里
      # 新增的真错一起放行；更早的「总数 >9 即失败」同样会漏。
      - name: Type check (gate)
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm check 2>&1 | tee typecheck.log
          check_status=${PIPESTATUS[0]}
          set -e

          # astro check 非 TTY 下也可能带 ANSI 色码，先剥掉再解析汇总行
          clean=$(sed 's/\x1b\[[0-9;]*m//g' typecheck.log)

          # 汇总行没出现说明 check 崩溃了（例如配置里有非法语法），不能当成 0 个错放行
          if ! echo "$clean" | grep -q '^Result ('; then
            echo "::error::astro check 没有输出汇总结果（astro check 退出码 $check_status），详见 typecheck.log"
            exit 1
          fi

          # 没有基线可豁免了：任何 error ts 都阻断部署。
          errors=$(echo "$clean" | grep 'error ts' || true)
          total=$(echo "$clean" | grep -oE '^- [0-9]+ errors' | tail -1 | grep -oE '[0-9]+' || true)
          total=${total:-0}
          echo "errors=$total" >> "$GITHUB_OUTPUT"
          echo "类型检查：共 $total 个错误（退出码 $check_status）"

          if [ -n "$errors" ]; then
            echo "$errors"
            echo "::error::存在类型错误，阻断部署"
            exit 1
          else
            echo "（无类型错误，放行）"
          fi

      - name: Create .nojekyll file
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
